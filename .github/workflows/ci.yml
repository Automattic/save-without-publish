name: CI

on:
  push:
  pull_request:
  # Pushes and pull requests test against the latest WordPress release, so a
  # red run points at the plugin change. This weekly run tests trunk and 6.8
  # instead (see the `core` matrix below): trunk so a core change that will
  # break the plugin shows up before it ships, 6.8 so the oldest version the
  # plugin promises keeps working.
  schedule:
    - cron: '0 6 * * 1'

# Nothing here writes; the default token scope is wider than these jobs need.
permissions:
  contents: read

jobs:
  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        run: composer phpcs

  build:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Build
        run: npm run build

  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
        # Push and pull request runs test one WordPress version -- the
        # latest release -- so a red run points at the plugin change. The
        # weekly run instead covers the two versions the review surface
        # branches on (VIPPROD-753, D1): trunk, so a core change that will
        # break the plugin shows up before it ships, and 6.8, the oldest
        # version `Requires at least` promises and the classic surface's
        # own floor.
        core: ${{ github.event_name == 'schedule' && fromJSON( '[ "master", "6.8" ]' ) || fromJSON( '[ "release" ]' ) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      # wp-env comes from package.json, and `npm run test:php` calls it, so this
      # job needs the JS dependencies as much as the e2e job does.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      # A runner is a fresh container on every run, so there is never an
      # existing database to leave behind on a version switch -- unlike a
      # local wp-env, which needs `wp core update-db` after one (learned
      # writing D1: a downgraded core otherwise shows "Database Update
      # Required" until it runs).
      # `core: null` would mean "the latest release", but wp-env resolves that
      # by asking wordpress.org for the version and then fetching that tag from
      # the WordPress/WordPress GitHub mirror -- which lags a point release by
      # hours, and every job died on `couldn't find remote ref 7.1.1` the day
      # 7.1.1 shipped. So the release is resolved here, against the mirror,
      # and when the mirror is behind the newest tag it does have is used and
      # the run says so. wordpress.org's version-check is the same source
      # wp-env itself reads.
      - name: Choose WordPress
        run: |
          if [ "${{ matrix.core }}" = "release" ]; then
            latest=$(curl -fsS https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')
            mirror='https://github.com/WordPress/WordPress.git'
            if git ls-remote --exit-code --tags "$mirror" "refs/tags/$latest" >/dev/null 2>&1; then
              core="$latest"
            else
              core=$(git ls-remote --tags "$mirror" 'refs/tags/*' | awk -F/ '{ print $3 }' | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
              echo "::notice title=WordPress mirror lag::wordpress.org says $latest is current, but the GitHub mirror has no such tag yet. Testing against $core, the newest it does have."
            fi
            echo "Testing against WordPress $core"
            echo "{\"core\":\"WordPress/WordPress#$core\"}" > .wp-env.override.json
          else
            echo '{"core":"WordPress/WordPress#${{ matrix.core }}"}' > .wp-env.override.json
          fi

      - name: Start WordPress
        run: npx wp-env start

      - name: Run PHPUnit
        run: npm run test:php

  e2e:
    name: Playwright (WP ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ${{ github.event_name == 'schedule' && fromJSON( '[ "master", "6.8" ]' ) || fromJSON( '[ "release" ]' ) }}
    # The suite takes about seven minutes on one worker on a fast machine, and
    # retries and a shared runner stretch that. Anything past this is a wedged
    # wp-env or browser, not a slow test.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      # The specs drive build/index.js, not src/. The `build` job compiles on a
      # different runner and discards the result, so this job builds its own.
      - name: Build
        run: npm run build

      # `core: null` would mean "the latest release", but wp-env resolves that
      # by asking wordpress.org for the version and then fetching that tag from
      # the WordPress/WordPress GitHub mirror -- which lags a point release by
      # hours, and every job died on `couldn't find remote ref 7.1.1` the day
      # 7.1.1 shipped. So the release is resolved here, against the mirror,
      # and when the mirror is behind the newest tag it does have is used and
      # the run says so. wordpress.org's version-check is the same source
      # wp-env itself reads.
      - name: Choose WordPress
        run: |
          if [ "${{ matrix.core }}" = "release" ]; then
            latest=$(curl -fsS https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')
            mirror='https://github.com/WordPress/WordPress.git'
            if git ls-remote --exit-code --tags "$mirror" "refs/tags/$latest" >/dev/null 2>&1; then
              core="$latest"
            else
              core=$(git ls-remote --tags "$mirror" 'refs/tags/*' | awk -F/ '{ print $3 }' | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
              echo "::notice title=WordPress mirror lag::wordpress.org says $latest is current, but the GitHub mirror has no such tag yet. Testing against $core, the newest it does have."
            fi
            echo "Testing against WordPress $core"
            echo "{\"core\":\"WordPress/WordPress#$core\"}" > .wp-env.override.json
          else
            echo '{"core":"WordPress/WordPress#${{ matrix.core }}"}' > .wp-env.override.json
          fi

      - name: Start WordPress
        run: npx wp-env start

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      # Screenshots and traces are only written for failures, and the HTML
      # report is what makes them readable without a local checkout.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

name: Release

on:
  push:
    tags:
      - 'v*'

# No permissions by default. The job that needs to write says so itself, and it
# is the one job that never runs npm.
permissions: {}

jobs:
  build:
    name: Build the plugin zip
    runs-on: ubuntu-latest
    # Deliberately no `permissions:` block. `npm ci` runs install scripts from
    # ~2000 dev packages, so this job holds no token they could reach.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the plugin header version
        run: |
          header="$(sed -n 's/^ \* Version: *//p' staged-edits.php | tr -d '[:space:]')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$header" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag, plugin header says $header." >&2
            exit 1
          fi
          # The Integration Center registers the plugin from this manifest, so
          # a tag that disagrees with it would hand the platform the wrong version.
          manifest="$(sed -n 's/^  plugin_version: *//p' vip-manifest.yaml | tr -d '[:space:]')"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag, vip-manifest.yaml says $manifest." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Copy only what the plugin loads at runtime. An allowlist cannot leak a
      # dev file the way a .distignore denylist can when someone forgets a line.
      - name: Assemble the plugin directory
        run: |
          mkdir -p dist/staged-edits
          cp -R staged-edits.php includes build README.md LICENSE dist/staged-edits/

      - name: Zip
        run: cd dist && zip -rq "../staged-edits-${GITHUB_REF_NAME}.zip" staged-edits

      - name: Hand the zip to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip
          path: staged-edits-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach the zip to a release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "staged-edits-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
